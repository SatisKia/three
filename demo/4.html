<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title></title>
<script src="texture_sample1.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { mySetAnimationLoop } from "./common.js";

const useDataUrl = false;

const FRAME_INTERVAL_MS = 1000 / 30/*フレーム*/;

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0000ff);

const camera = new THREE.PerspectiveCamera(45.0, canvas3d.width / canvas3d.height, 0.1, 100.0);
camera.position.set(0.0, 0.0, 0.0);
camera.lookAt(0.0, 0.0, -1.0);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, alpha: true });
renderer.setSize(canvas3d.width, canvas3d.height);
renderer.setPixelRatio(window.devicePixelRatio);

const geom = new THREE.PlaneGeometry(2.0, 2.0);

const loader = new THREE.TextureLoader();
const texture = loader.load(useDataUrl ? img_src : "texture/sample1.png");
texture.wrapS = THREE.RepeatWrapping;
texture.wrapT = THREE.RepeatWrapping;
texture.minFilter = THREE.LinearFilter;
texture.magFilter = THREE.LinearFilter;
texture.colorSpace = THREE.SRGBColorSpace;
texture.flipY = true; // THREE.PlaneGeometryではtrueにしないと画像が反転する
const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });

const model = new THREE.Mesh(geom, material);
model.position.set(0.0, 0.0, -6.0);
model.rotation.set(
  THREE.MathUtils.degToRad(45.0), // X軸回転
  THREE.MathUtils.degToRad(30.0), // Y軸回転
  THREE.MathUtils.degToRad(15.0), // Z軸回転
  "ZYX"
);
scene.add(model);

let scroll = 0.0;
let old_time = performance.now();

mySetAnimationLoop(renderer, FRAME_INTERVAL_MS, (now) => {
  const time = now - old_time;
  old_time = now;

  scroll -= 0.01;
  texture.offset.set(scroll, -scroll);
  renderer.render(scene, camera);

  // 2Dグラフィック画面の描画
  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.font = "24px 'MS Gothic', sans-serif";
  context.fillStyle = "rgb(255, 0, 255)";
  context.fillText("fps " + (time > 0.0 ? (1000.0 / time).toFixed(1) : "0"), 0, 24);
});
</script>
</head>
<body>
<div align="center">
  <div style="position:relative">
    <canvas id="hoge_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
  </div>
</div>
</body>
</html>
