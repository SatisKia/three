<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title></title>
<script src="texture_witch.js"></script>
<script src="texture_mesh.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/loaders/OBJLoader.js": "./node_modules/three/examples/jsm/loaders/OBJLoader.js",
    "three/addons/loaders/MTLLoader.js": "./node_modules/three/examples/jsm/loaders/MTLLoader.js",
    "three/addons/objects/Reflector.js": "./node_modules/three/examples/jsm/objects/Reflector.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { Reflector } from "three/addons/objects/Reflector.js";
import { applyDiffuse, applyDiffuseMapsFromUrls, applyKaBlendToDiffuse, applySmoothShading, convertMaterialsToLambert, loadObjMtl } from "./loadObjMtl.js";
import { setAnimationLoop } from "./common.js";

const useDataUrlMesh = false;

const MODEL_DIR = "./model/";

// d2jsのuseStereoTrans時: 左眼cameraX+stereoTrans、右眼cameraX-stereoTrans（stereoTrans=0.2）
// Three.StereoCameraのeyeSepは両眼の間隔（ワールド単位）として2*stereoTransを相当させる
const STEREO_TRANS = 0.2;
const STEREO_EYE_SEP = 2 * STEREO_TRANS;

const AMBIENT_LIGHT_COEF = 1.0; // d2js版と見た目が同じになるように係数をかける
const DIRECTIONAL_LIGHT_COEF = 5.0; // d2js版と見た目が同じになるように係数をかける

const GROUND_MODEL_SCALE = 0.033;
const GROUND_PLANE_SIZE = 200 * GROUND_MODEL_SCALE;
const REFLECTOR_COLOR = 0xffffff;
const WATER_COLOR = 0x808080;
const WATER_METALNESS = 0.12;
const WATER_ROUGHNESS = 0.05;
const WATER_CLEARCOAT = 0.92;
const WATER_CLEARCOAT_ROUGHNESS = 0.03;
const WATER_IOR = 1.333;
const WATER_SPECULAR_INTENSITY = 1.35;

const WATER_MESH_SEGMENTS_X = 192;
const WATER_MESH_SEGMENTS_Z = 192;
const WAVE_RIPPLE_DENSITY_X = 3.0;
const WAVE_RIPPLE_DENSITY_Z = 3.0;
const WAVE_ANIM_SPEED = 0.25;
const WAVE_AMPLITUDE = 0.05;
const WAVE_PHASE_RATIO = 0.7;
const WAVE_FBM_SUM_MAX = 0.5;
const WAVE_COMBINED_FREQ_X = WAVE_RIPPLE_DENSITY_X;
const WAVE_COMBINED_FREQ_Z = WAVE_RIPPLE_DENSITY_Z;
const WAVE_COMBINED_AMP_Z_RATIO = 0.2;
const WAVE_COMBINED_SPEED = 1.5;
const WAVE_COMBINED_NOISE_STRENGTH = 0.5;
const WAVE_COMBINED_NOISE_AMP = 0.5;
const WAVE_COMBINED_NOISE_U = 0.06;
const WAVE_COMBINED_NOISE_TIME = 0.1;

let dispMesh = false;
let meshObjRoot = null;
let waveType = 0;

function myRandom(ix, iy) {
  const t = Math.sin(ix * 12.9898 + iy * 78.233) * 43758.5453123;
  return t - Math.floor(t);
}
function combinedWave(x, zPlane, freq, amp, speedMul, elapseT, dx, dz, withNoise) {
  let phase = (x * dx + zPlane * dz) * freq + elapseT * WAVE_COMBINED_SPEED * speedMul;
  let a = amp;
  if (withNoise) {
    const ncx = x * dx * WAVE_COMBINED_NOISE_U;
    const ncz = zPlane * dz * WAVE_COMBINED_NOISE_U + elapseT * WAVE_COMBINED_NOISE_TIME;
    const scale = 1.0;
    let nr = 0.0;
    let ampN = 1.0;
    let fr = 1.0;
    for (let o = 0; o < 4; o++) {
      const fbx = ncx * fr * scale;
      const fby = ncz * fr * scale;
      const fi = Math.floor(fbx);
      const fj = Math.floor(fby);
      const f = fbx - fi;
      const g = fby - fj;
      const ra = myRandom(fi, fj);
      const rb = myRandom(fi + 1, fj);
      const rc = myRandom(fi, fj + 1);
      const rd = myRandom(fi + 1, fj + 1);
      const u = f * f * (3.0 - 2.0 * f);
      const v = g * g * (3.0 - 2.0 * g);
      const sm = ra + (rb - ra) * u + (rc - ra) * v * (1 - u) + (rd - rb) * u * v;
      nr += ampN * sm;
      ampN *= 0.5;
      fr *= 2.0;
    }
    const nv = (nr / WAVE_FBM_SUM_MAX) * WAVE_COMBINED_NOISE_STRENGTH;
    phase += nv * Math.PI;
    a *= 1.0 + nv * WAVE_COMBINED_NOISE_AMP;
  }
  return Math.sin(phase) * a;
}

let image_loaded = false;

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0000ff);

const stereoCamera = new THREE.StereoCamera();
stereoCamera.eyeSep = STEREO_EYE_SEP;
stereoCamera.aspect = (canvas3d.width / 2) / canvas3d.height;

const lookY = 0.0;
const camera = new THREE.PerspectiveCamera(45.0, stereoCamera.aspect, 0.1, 100.0);
camera.position.set(0.0, 0.0, 7.5);
camera.lookAt(0.0, lookY, 0.0);
camera.layers.enable(1);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
renderer.setSize(canvas3d.width, canvas3d.height);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scenePivot = new THREE.Group();
scenePivot.position.set(0.0, lookY, 0.0);
scene.add(scenePivot);

const worldPivot = new THREE.Vector3(0.0, lookY, 0.0);

let lightX = -3.0;
let lightY = 7.5;
let lightZ = 3.5;
const LIGHT_STEP = 0.1;

let rotateX = 25.0;
let rotateY = 25.0;

const keys = new Set();
window.addEventListener("keydown", (e) => keys.add(e.code));
window.addEventListener("keyup", (e) => keys.delete(e.code));

const waterGeometry = new THREE.PlaneGeometry(GROUND_PLANE_SIZE, GROUND_PLANE_SIZE, WATER_MESH_SEGMENTS_X, WATER_MESH_SEGMENTS_Z);
const reflector = new Reflector(waterGeometry, {
  color: REFLECTOR_COLOR,
  textureWidth: canvas3d.width / 2,
  textureHeight: canvas3d.height,
});
reflector.rotation.x = -Math.PI / 2;
reflector.position.y = 0.01;
const waterMaterial = new THREE.MeshPhysicalMaterial({
  color: WATER_COLOR,
  metalness: WATER_METALNESS,
  roughness: WATER_ROUGHNESS,
  clearcoat: WATER_CLEARCOAT,
  clearcoatRoughness: WATER_CLEARCOAT_ROUGHNESS,
  ior: WATER_IOR,
  specularIntensity: WATER_SPECULAR_INTENSITY,
  transparent: true,
  opacity: 0.55,
  side: THREE.DoubleSide,
  depthWrite: false,
});
const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.rotation.x = -Math.PI / 2;
water.position.y = 0.02;
water.renderOrder = 1;
water.layers.set(1);
water.receiveShadow = true;
scenePivot.add(reflector);
scenePivot.add(water);

const light = new THREE.DirectionalLight(0xffffff, 1.0 * DIRECTIONAL_LIGHT_COEF);
light.layers.enable(1); // 水面はレイヤ1。影の投射・受光の対象に含める
light.castShadow = true;
light.shadow.mapSize.set(2048, 2048);
light.shadow.camera.near = 0.5;
light.shadow.camera.far = 40.0;
const shadowExtent = 12.0 * (GROUND_PLANE_SIZE / 20.0);
light.shadow.camera.left = -shadowExtent;
light.shadow.camera.right = shadowExtent;
light.shadow.camera.top = shadowExtent;
light.shadow.camera.bottom = -shadowExtent;
light.position.set(lightX, lightY, lightZ);
light.target.position.set(0.0, lookY, 0.0);
scene.add(light);
scene.add(light.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.5 * AMBIENT_LIGHT_COEF));

function renderStereo() {
  camera.updateMatrixWorld();
  stereoCamera.update(camera);
  // StereoCameraはcameraLにレイヤ1、cameraRにレイヤ2を追加する既定のため、
  // 水面（layers=1）が右眼に乗らず反射だけが強く見える。リグと同じレイヤマスクに揃える。
  stereoCamera.cameraL.layers.mask = camera.layers.mask;
  stereoCamera.cameraR.layers.mask = camera.layers.mask;

  // setViewport/setScissorは論理ピクセル指定（内部でpixelRatioを掛ける）
  const size = new THREE.Vector2();
  renderer.getSize(size); // renderer.domElement.width/renderer.domElement.heightは使えない
  const halfW = Math.floor(size.width / 2);

  renderer.setScissorTest(true);

  renderer.setViewport(0, 0, halfW, size.height);
  renderer.setScissor(0, 0, halfW, size.height);
  renderer.render(scene, stereoCamera.cameraL);

  renderer.setViewport(halfW, 0, halfW, size.height);
  renderer.setScissor(halfW, 0, halfW, size.height);
  renderer.render(scene, stereoCamera.cameraR);

  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, size.width, size.height);
}

(async () => {
  const specs = [
    { name: "witch", scale: 0.015, pos: [0.0, 0.05, 0.0], diffuse: 0.8 },
    { name: "cat", scale: 0.005, pos: [-1.5, 0.4, 0.5] },
    { name: "swan", scale: 0.005, pos: [2.0, 2.0, 0.5], kaBlend: 0.35 },
    { name: "mesh", scale: GROUND_MODEL_SCALE, pos: [0.0, 1.2, -1.5] },
  ];
  try {
    for (const s of specs) {
      const root = await loadObjMtl(MODEL_DIR, s.name);
      convertMaterialsToLambert(root);
      if (s.name === "witch") {
        applyDiffuseMapsFromUrls(root, [
          { materialName: "kao", url: img_src[0] },
          { materialName: "body", url: img_src[1] },
          { materialName: "fire", url: img_src[2] },
        ]);
      }
      if (s.name === "mesh") {
        applyDiffuseMapsFromUrls(root, [
          { materialName: "mat1", url: useDataUrlMesh ? img_src_mesh : "texture/mesh.png" },
        ]);
      }
      if (s.diffuse !== undefined) applyDiffuse(root, new THREE.Color(s.diffuse, s.diffuse, s.diffuse));
      if (s.kaBlend !== undefined) applyKaBlendToDiffuse(root, s.kaBlend);
      applySmoothShading(root);
      root.scale.setScalar(s.scale);
      root.position.set(s.pos[0], s.pos[1], s.pos[2]);
      const castShadow = !s.ground;
      root.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = castShadow;
          obj.receiveShadow = true;
        }
      });
      scenePivot.add(root);
      if (s.name === "mesh") meshObjRoot = root;
    }
    if (meshObjRoot) meshObjRoot.visible = dispMesh;
    image_loaded = true;
  } catch (e) {
    console.error(e);
  }
})();

let elapse = 0;
setAnimationLoop(renderer, () => (image_loaded ? 1000 / 30/*フレーム*/ : 100), () => {
  if (keys.has("ArrowUp")) lightY += LIGHT_STEP;
  if (keys.has("ArrowDown")) lightY -= LIGHT_STEP;
  if (keys.has("ArrowLeft")) lightX -= LIGHT_STEP;
  if (keys.has("ArrowRight")) lightX += LIGHT_STEP;
  if (keys.has("KeyZ")) lightZ += LIGHT_STEP;
  if (keys.has("KeyX")) lightZ -= LIGHT_STEP;

  elapse += WAVE_ANIM_SPEED;
  const pos = waterGeometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const zPlane = pos.getY(i);
    let hVal;
    if (waveType === 0) {
      hVal =
        WAVE_AMPLITUDE *
        Math.sin(x * WAVE_RIPPLE_DENSITY_X + elapse) *
        Math.cos(zPlane * WAVE_RIPPLE_DENSITY_Z + elapse * WAVE_PHASE_RATIO);
    } else {
      const useNoise = waveType === 2;

      const ax = WAVE_AMPLITUDE * 0.38;
      const az = WAVE_AMPLITUDE * 0.38 * WAVE_COMBINED_AMP_Z_RATIO;

      hVal = 0.0;
      hVal += combinedWave(x, zPlane, WAVE_COMBINED_FREQ_X, ax, 1.0, elapse, 1.0, 0.0, useNoise);
      hVal += combinedWave(x, zPlane, WAVE_COMBINED_FREQ_X * 0.7, ax * 0.5, 0.8, elapse, 0.7, 0.7, useNoise);
      hVal += combinedWave(x, zPlane, WAVE_COMBINED_FREQ_X * 1.5, ax * 0.3, 1.2, elapse, 0.3, 0.9, useNoise);
      hVal += combinedWave(x, zPlane, WAVE_COMBINED_FREQ_Z, az, 1.0, elapse, 0.0, 1.0, useNoise);
      hVal += combinedWave(x, zPlane, WAVE_COMBINED_FREQ_Z * 0.7, az * 0.5, 0.8, elapse, 0.7, 0.7, useNoise);
      hVal += combinedWave(x, zPlane, WAVE_COMBINED_FREQ_Z * 1.5, az * 0.3, 1.2, elapse, 0.3, 0.9, useNoise);
    }
    pos.setZ(i, hVal);
  }
  pos.needsUpdate = true;
  waterGeometry.computeVertexNormals();

  scenePivot.rotation.set(
    THREE.MathUtils.degToRad(rotateX),
    THREE.MathUtils.degToRad(rotateY),
    0.0,
    "XYZ"
  );

  const pivotRot = new THREE.Matrix4().makeRotationFromEuler(scenePivot.rotation);
  const transLight = new THREE.Vector3(lightX, lightY, lightZ)
    .sub(worldPivot)
    .applyMatrix4(pivotRot)
    .add(worldPivot);
  light.position.copy(transLight);
  light.target.position.set(0.0, lookY, 0.0);
  light.target.updateMatrixWorld();

  camera.lookAt(0.0, lookY, 0.0);
  renderStereo();

  // 2Dグラフィック画面の描画
  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.font = "24px 'MS Gothic', sans-serif";
  context.fillStyle = "rgb(255, 0, 255)";
  context.fillText("waveType " + waveType, 0, 24);
  context.fillText("rotateX " + rotateX.toFixed(1), 0, 48);
  context.fillText("rotateY " + rotateY.toFixed(1), 0, 72);
  context.fillText("lightX " + lightX.toFixed(1), 0, 96);
  context.fillText("lightY " + lightY.toFixed(1), 0, 120);
  context.fillText("lightZ " + lightZ.toFixed(1), 0, 144);
});

let mouseDown = false;
let mouseX = 0;
let mouseY = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
  mouseDown = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
window.addEventListener("pointerup", () => {
  mouseDown = false;
});
window.addEventListener("pointermove", (e) => {
  if (!mouseDown) return;
  rotateX += (e.clientY - mouseY) / 2.0;
  rotateY += (e.clientX - mouseX) / 2.0;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Digit1" || e.code === "Numpad1") waveType = 0;
  else if (e.code === "Digit2" || e.code === "Numpad2") waveType = 1;
  else if (e.code === "Digit3" || e.code === "Numpad3") waveType = 2;
});
</script>
</head>
<body>
<div align="center">
  <div style="position:relative">
    <canvas id="hoge_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="1024" height="480"></canvas>
    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0); pointer-events:none" width="1024" height="480"></canvas>
  </div>
</div>
