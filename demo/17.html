<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title></title>
<script src="texture_sample2.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/postprocessing/EffectComposer.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js",
    "three/addons/postprocessing/RenderPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js",
    "three/addons/postprocessing/BokehPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/BokehPass.js",
    "three/addons/postprocessing/OutputPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/OutputPass.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { setAnimationLoop } from "./common.js";

const useDataUrl = false;

const FRAME_INTERVAL_MS = 1000 / 30/*フレーム*/;

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

let focusDepth = 0.33; // 0～1。被写面の奥行きの目安。「focus = focusDepth * fogFar」にマップ
let focusRange = 0.8; // ピントの幅の目安（小さいほどボケ境界が急）。カメラレンズの絞り（アパチャー）に反映。光量と被写界深度（ピントの合う範囲）を調整。
let maxBlur = 0.0033; // 最大ぼかしの目安。BokehShaderのmaxblurにスケールして渡す
const fogFar = 20.0;

// BokehPassに渡すパラメータ
function bokehPassParams(focusDepth, focusRange, maxBlur) {
  return {
    focus: focusDepth * fogFar,
    aperture: THREE.MathUtils.clamp(0.01 / focusRange, 0.001, 0.15),
    maxblur: THREE.MathUtils.clamp(maxBlur * 3.0, 0.002, 0.04),
  };
}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0000ff);

const camera = new THREE.PerspectiveCamera(45.0, canvas3d.width / canvas3d.height, 0.1, 100.0);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, alpha: true });
renderer.setSize(canvas3d.width, canvas3d.height);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bokehPass = new BokehPass(scene, camera, bokehPassParams(focusDepth, focusRange, maxBlur));
composer.addPass(bokehPass);
composer.addPass(new OutputPass()); // EffectComposerやRTT（Render To Texture、テクスチャへのレンダリング）経由だと中間バッファが線形のまま最後まで行き、画面に出る直前にsRGBに戻していないと、全体が一段暗く見えるため、チェーンの最後にOutputPassを足す

const loader = new THREE.TextureLoader();
const texture = loader.load(useDataUrl ? img_src : "texture/sample2.png");
texture.colorSpace = THREE.SRGBColorSpace;
texture.flipY = true;

const group = new THREE.Group();
for (let z = -10.0; z <= 10.0; z += 2.0) {
  for (let x = -10.0; x <= 10.0; x += 2.0) {
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
    const sprite = new THREE.Sprite(material);
    sprite.position.set(x, 0.0, z);
    sprite.scale.set(1.0, 1.0, 1.0);
    group.add(sprite);
  }
}
scene.add(group);

let angle = 0.0;
const camera_x = 0.0;
const camera_y = 3.0;
const camera_z = 6.0;

const keys = new Set();
window.addEventListener("keydown", (e) => keys.add(e.code));
window.addEventListener("keyup", (e) => keys.delete(e.code));

setAnimationLoop(renderer, FRAME_INTERVAL_MS, () => {
  if (keys.has("ArrowUp")) focusDepth += 0.01;
  if (keys.has("ArrowDown")) focusDepth -= 0.01;
  if (keys.has("ArrowLeft")) focusRange -= 0.01;
  if (keys.has("ArrowRight")) focusRange += 0.01;
  if (keys.has("KeyZ")) maxBlur -= 0.001;
  if (keys.has("KeyX")) maxBlur += 0.001;

  focusDepth = THREE.MathUtils.clamp(focusDepth, 0.0, 1.0);
  focusRange = THREE.MathUtils.clamp(focusRange, 0.001, 1.0);
  maxBlur = Math.max(0.0, maxBlur);

  angle += 0.012;
  const rotX = camera_x * Math.cos(angle) - camera_z * Math.sin(angle);
  const rotZ = camera_z * Math.cos(angle) + camera_x * Math.sin(angle);
  camera.position.set(rotX, camera_y, rotZ);
  camera.lookAt(0.0, 0.0, 0.0);

  camera.updateMatrixWorld();
  for (const spr of group.children) {
    spr.rotation.copy(camera.rotation);
  }

  const pBokeh = bokehPassParams(focusDepth, focusRange, maxBlur);
  bokehPass.uniforms.focus.value = pBokeh.focus;
  bokehPass.uniforms.aperture.value = pBokeh.aperture;
  bokehPass.uniforms.maxblur.value = pBokeh.maxblur;

  composer.render();

  // 2Dグラフィック画面の描画
  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.font = "24px 'MS Gothic', sans-serif";
  context.fillStyle = "rgb(255, 0, 255)";
  context.fillText("focusDepth " + focusDepth.toFixed(2) + " → BokehPass focus " + bokehPass.uniforms.focus.value.toFixed(2), 0, 24);
  context.fillText("focusRange " + focusRange.toFixed(2) + " → BokehPass aperture " + bokehPass.uniforms.aperture.value.toFixed(4), 0, 48);
  context.fillText("maxBlur " + maxBlur.toFixed(4) + " → BokehPass maxblur " + bokehPass.uniforms.maxblur.value.toFixed(4), 0, 72);
});
</script>
</head>
<body>
<div align="center">
  <div style="position:relative">
    <canvas id="hoge_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
  </div>
</div>
</body>
</html>
