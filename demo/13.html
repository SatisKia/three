<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title></title>
<script src="texture_witch.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/loaders/OBJLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/OBJLoader.js",
    "three/addons/loaders/MTLLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/MTLLoader.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { applyDiffuse, applyDiffuseMapsFromDataUrls, applyKaBlendToDiffuse, applySmoothShading, convertMaterialsToLambert, loadObjMtl } from "./loadObjMtl.js";
import { setAnimationLoop } from "./common.js";

const useWireframe = false;
const WIREFRAME_GRAY = 0.5;

const MODEL_DIR = "./model/";

const AMBIENT_LIGHT_COEF = 1.0; // d2js版と見た目が同じになるように係数をかける
const DIRECTIONAL_LIGHT_COEF = 5.0; // d2js版と見た目が同じになるように係数をかける

let image_loaded = false;

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0000ff);
scene.fog = new THREE.Fog(0x0000ff, 10.0, 50.0);

const lookY = 2.5;
const camera = new THREE.PerspectiveCamera(45.0, canvas3d.width / canvas3d.height, 0.1, 100.0);
camera.position.set(0.0, 2.5, 5.0);
camera.lookAt(0.0, lookY, 0.0);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
renderer.setSize(canvas3d.width, canvas3d.height);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 既定値：PCFShadowMap
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scenePivot = new THREE.Group();
scenePivot.position.set(0.0, lookY, 0.0);
scene.add(scenePivot);

const worldPivot = new THREE.Vector3(0.0, lookY, 0.0);

let lightX = -3.0;
let lightY = 7.5;
let lightZ = 3.5;
const LIGHT_STEP = 0.1;

let rotateX = 20.0;
let rotateY = 20.0;

const dir = new THREE.DirectionalLight(0xffffff, 1.0 * DIRECTIONAL_LIGHT_COEF); // d2js版と見た目が同じになるように係数をかける
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.near = 0.5;
dir.shadow.camera.far = 40.0;
dir.shadow.camera.left = -10.0;
dir.shadow.camera.right = 10.0;
dir.shadow.camera.top = 10.0;
dir.shadow.camera.bottom = -10.0;
dir.position.set(lightX, lightY, lightZ);
dir.target.position.set(0.0, lookY, 0.0);
scene.add(dir);
scene.add(dir.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.5 * AMBIENT_LIGHT_COEF)); // d2js版と見た目が同じになるように係数をかける

const keys = new Set();
window.addEventListener("keydown", (e) => keys.add(e.code));
window.addEventListener("keyup", (e) => keys.delete(e.code));

(async () => {
  const specs = [
    { name: "witch", scale: 0.015, pos: [0.0, 0.05, 0.0], diffuse: 0.8 },
    { name: "cat", scale: 0.005, pos: [-1.5, 0.4, 0.5] },
    { name: "swan", scale: 0.005, pos: [2.0, 2.0, 0.5], kaBlend: 0.35 },
    { name: "ground", scale: 0.1, pos: [0.0, 0.0, 0.0], ground: true },
  ];
  try {
    for (const s of specs) {
      const root = await loadObjMtl(MODEL_DIR, s.name);
      convertMaterialsToLambert(root);
      if (s.name === "witch") {
        applyDiffuseMapsFromDataUrls(root, [
          { materialName: "kao", dataUrl: img_src[0] },
          { materialName: "body", dataUrl: img_src[1] },
          { materialName: "fire", dataUrl: img_src[2] },
        ]);
      }
      if (s.diffuse !== undefined) applyDiffuse(root, new THREE.Color(s.diffuse, s.diffuse, s.diffuse));
      if (s.kaBlend !== undefined) applyKaBlendToDiffuse(root, s.kaBlend);
      applySmoothShading(root);
      root.scale.setScalar(s.scale);
      root.position.set(s.pos[0], s.pos[1] - lookY, s.pos[2]);
      const castShadow = !s.ground;
      root.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = castShadow;
          obj.receiveShadow = true;
        }
      });
      scenePivot.add(root);
      root.traverse((o) => {
        if (!o.isMesh) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) {
          if (!m || !m.isMaterial) continue;
          m.wireframe = useWireframe;
          if (useWireframe) {
            m.color.setRGB(WIREFRAME_GRAY, WIREFRAME_GRAY, WIREFRAME_GRAY);
            if (m.emissive) m.emissive.setRGB(0.0, 0.0, 0.0);
            m.map = null;
            m.normalMap = null;
            m.aoMap = null;
          }
        }
      });
    }
    image_loaded = true;
  } catch (e) {
    console.error(e);
  }
})();

setAnimationLoop(renderer, () => (image_loaded ? 1000 / 30/*フレーム*/ : 100), () => {
  if (keys.has("ArrowUp")) lightY += LIGHT_STEP;
  if (keys.has("ArrowDown")) lightY -= LIGHT_STEP;
  if (keys.has("ArrowLeft")) lightX -= LIGHT_STEP;
  if (keys.has("ArrowRight")) lightX += LIGHT_STEP;
  if (keys.has("KeyZ")) lightZ += LIGHT_STEP;
  if (keys.has("KeyX")) lightZ -= LIGHT_STEP;

  scenePivot.rotation.set(
    THREE.MathUtils.degToRad(rotateX),
    THREE.MathUtils.degToRad(rotateY),
    0.0,
    "XYZ"
  );

  const pivotRot = new THREE.Matrix4().makeRotationFromEuler(scenePivot.rotation);
  const transLight = new THREE.Vector3(lightX, lightY, lightZ) // transLight = R * (light - pivot) + pivot（RはscenePivotと同一）
    .sub(worldPivot)
    .applyMatrix4(pivotRot)
    .add(worldPivot);
  dir.position.copy(transLight);
  dir.target.position.set(0.0, lookY, 0.0);
  dir.target.updateMatrixWorld();

  camera.lookAt(0.0, lookY, 0.0);
  renderer.render(scene, camera);

  // 2Dグラフィック画面の描画
  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.font = "24px 'MS Gothic', sans-serif";
  context.fillStyle = "rgb(255, 0, 255)";
  context.fillText("rotateX " + rotateX.toFixed(1), 0, 24);
  context.fillText("rotateY " + rotateY.toFixed(1), 0, 48);
  context.fillText("lightX " + lightX.toFixed(1), 0, 72);
  context.fillText("lightY " + lightY.toFixed(1), 0, 96);
  context.fillText("lightZ " + lightZ.toFixed(1), 0, 120);
});

let mouseDown = false;
let mouseX = 0;
let mouseY = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
  mouseDown = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
window.addEventListener("pointerup", () => {
  mouseDown = false;
});
window.addEventListener("pointermove", (e) => {
  if (!mouseDown) return;
  rotateX += (e.clientY - mouseY) / 2.0;
  rotateY += (e.clientX - mouseX) / 2.0;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
</script>
</head>
<body>
<div align="center">
  <div style="position:relative">
    <canvas id="hoge_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0); pointer-events:none" width="640" height="480"></canvas>
  </div>
</div>
</body>
</html>
