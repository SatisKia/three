<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title></title>
<script src="texture_witch.js"></script>
<script src="texture_mesh.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/loaders/OBJLoader.js": "./node_modules/three/examples/jsm/loaders/OBJLoader.js",
    "three/addons/loaders/MTLLoader.js": "./node_modules/three/examples/jsm/loaders/MTLLoader.js",
    "three/addons/objects/Reflector.js": "./node_modules/three/examples/jsm/objects/Reflector.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { Reflector } from "three/addons/objects/Reflector.js";
import { applyDiffuse, applyDiffuseDataUrlTextures, applyKaBlendToDiffuse, applySmoothShading, convertMaterialsToLambert, loadObjMtl } from "./loadObjMtl.js";
import { setAnimationLoop } from "./common.js";

const MODEL_DIR = "./model/";

const AMBIENT_LIGHT_COEF = 1.0; // d2js版と見た目が同じになるように係数をかける
const DIRECTIONAL_LIGHT_COEF = 5.0; // d2js版と見た目が同じになるように係数をかける

const GROUND_PLANE_SIZE = 200 * 0.033;
const REFLECTOR_COLOR = 0xffffff;
const WATER_COLOR = 0x808080;

// 0=sin/cosの単純オフセット 1=重ね波（sinのみ） 2=重ね波＋ノイズ
let waveType = 0;

// Reflector既定フラグメントに、UVゆらぎを追加。gl_FragCoordベースでoffsetを積み、texture2DProj前に透視補正UVへ加える。
const WaterRippleReflectorShader = {
  name: "WaterRippleReflectorShader",
  uniforms: {
    color: { value: new THREE.Color(0x7f7f7f) },
    tDiffuse: { value: null },
    textureMatrix: { value: new THREE.Matrix4() },
    uWaveType: { value: 0 },
    uFrequencyX: { value: 0.1 },
    uFrequencyY: { value: 0.1 },
    uAmplitudeX: { value: 0.001 * 20 },
    uAmplitudeY: { value: 0.001 },
    uSpeedX: { value: 0.5 },
    uSpeedY: { value: 0.5 },
    uElapse: { value: 0.0 },
    uNoiseScale: { value: 0.02 },
    uNoiseTimeScale: { value: 0.1 },
    uNoiseStrength: { value: 0.2 },
    uNoiseAmplitude: { value: 0.5 },
  },
  vertexShader: /*glsl*/`
    uniform mat4 textureMatrix;
    varying vec4 vUv;

    #include <common>
    #include <logdepthbuf_pars_vertex>

    void main() {
      vUv = textureMatrix * vec4( position, 1.0 );
      gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
      #include <logdepthbuf_vertex>
    }
  `,
  fragmentShader: /*glsl*/`
    uniform vec3 color;
    uniform sampler2D tDiffuse;
    uniform int uWaveType;
    uniform float uFrequencyX, uFrequencyY;
    uniform float uAmplitudeX, uAmplitudeY;
    uniform float uSpeedX, uSpeedY;
    uniform float uElapse;
    uniform float uNoiseScale;
    uniform float uNoiseTimeScale;
    uniform float uNoiseStrength;
    uniform float uNoiseAmplitude;

    varying vec4 vUv;

    #include <logdepthbuf_pars_fragment>

    float rand(vec2 st) {
      return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
    }

    float smoothNoise(vec2 st) {
      vec2 i = floor(st);
      vec2 f = fract(st);
      float a = rand(i);
      float b = rand(i + vec2(1.0, 0.0));
      float c = rand(i + vec2(0.0, 1.0));
      float d = rand(i + vec2(1.0, 1.0));
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
    }

    float fbmNoise(vec2 st, float scale) {
      float value = 0.0;
      float amplitude = 1.0;
      float frequency = 1.0;
      for ( int i = 0; i < 4; i++ ) {
        value += amplitude * smoothNoise(st * frequency * scale);
        amplitude *= 0.5;
        frequency *= 2.0;
      }
      return value;
    }

    float waveOffset(float x, float y, float freq, float amp, float speed, float time, float dx, float dy) {
      if ( uWaveType == 1 ) {
        return sin(x * dx * freq + y * dy * freq + time * speed) * amp;
      }
      vec2 noiseCoord = vec2(x * dx * uNoiseScale, y * dy * uNoiseScale + time * uNoiseTimeScale);
      float noiseValue = fbmNoise(noiseCoord, 1.0) * uNoiseStrength;
      float w = sin(x * dx * freq + y * dy * freq + time * speed + noiseValue * 3.14159);
      return w * amp * (1.0 + noiseValue * uNoiseAmplitude);
    }

    float blendOverlay( float base, float blend ) {
      return ( base < 0.5 ? ( 2.0 * base * blend ) : ( 1.0 - 2.0 * ( 1.0 - base ) * ( 1.0 - blend ) ) );
    }

    vec3 blendOverlay( vec3 base, vec3 blend ) {
      return vec3(
        blendOverlay( base.r, blend.r ),
        blendOverlay( base.g, blend.g ),
        blendOverlay( base.b, blend.b )
      );
    }

    void main() {
      #include <logdepthbuf_fragment>

      float offsetX = 0.0;
      if ( uFrequencyX != 0.0 ) {
        if ( uWaveType == 0 ) {
          offsetX = sin(gl_FragCoord.x * uFrequencyX + uElapse * uSpeedX) * uAmplitudeX;
        } else {
          offsetX += waveOffset(gl_FragCoord.x, gl_FragCoord.y, uFrequencyX, uAmplitudeX, uSpeedX, uElapse, 1.0, 0.0);
          offsetX += waveOffset(gl_FragCoord.x, gl_FragCoord.y, uFrequencyX * 0.7, uAmplitudeX * 0.5, uSpeedX * 0.8, uElapse, 0.7, 0.7);
          offsetX += waveOffset(gl_FragCoord.x, gl_FragCoord.y, uFrequencyX * 1.5, uAmplitudeX * 0.3, uSpeedX * 1.2, uElapse, 0.3, 0.9);
        }
      }
      float offsetY = 0.0;
      if ( uFrequencyY != 0.0 ) {
        if ( uWaveType == 0 ) {
          offsetY = cos(gl_FragCoord.y * uFrequencyY + uElapse * uSpeedY) * uAmplitudeY;
        } else {
          offsetY += waveOffset(gl_FragCoord.x, gl_FragCoord.y, uFrequencyY, uAmplitudeY, uSpeedY, uElapse, 0.0, 1.0);
          offsetY += waveOffset(gl_FragCoord.x, gl_FragCoord.y, uFrequencyY * 0.7, uAmplitudeY * 0.5, uSpeedY * 0.8, uElapse, 0.7, 0.7);
          offsetY += waveOffset(gl_FragCoord.x, gl_FragCoord.y, uFrequencyY * 1.5, uAmplitudeY * 0.3, uSpeedY * 1.2, uElapse, 0.3, 0.9);
        }
      }

      float w = vUv.w;
      vec2 uv = vUv.xy / w;
      uv.x += offsetX;
      uv.y += offsetY;
      vec4 distortedUv = vec4(uv * w, vUv.z, w);

      vec4 base = texture2DProj( tDiffuse, distortedUv );
      gl_FragColor = vec4( blendOverlay( base.rgb, color ), 1.0 );

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
};

let image_loaded = false;

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0000ff);

const lookY = 0.0;
const camera = new THREE.PerspectiveCamera(45.0, canvas3d.width / canvas3d.height, 0.1, 100.0);
camera.position.set(0.0, 0.0, 7.5);
camera.lookAt(0.0, lookY, 0.0);
camera.layers.enable(1);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
renderer.setSize(canvas3d.width, canvas3d.height);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scenePivot = new THREE.Group();
scenePivot.position.set(0.0, lookY, 0.0);
scene.add(scenePivot);

const worldPivot = new THREE.Vector3(0.0, lookY, 0.0);

let lightX = -3.0;
let lightY = 7.5;
let lightZ = 3.5;
const LIGHT_STEP = 0.1;

let rotateX = 25.0;
let rotateY = 25.0;

const keys = new Set();
window.addEventListener("keydown", (e) => keys.add(e.code));
window.addEventListener("keyup", (e) => keys.delete(e.code));

// 水平面はフラット（ゆらぎはReflectorのフラグメントで反射UVオフセット）
const waterGeometry = new THREE.PlaneGeometry(GROUND_PLANE_SIZE, GROUND_PLANE_SIZE, 1, 1);
const reflector = new Reflector(waterGeometry, {
  color: REFLECTOR_COLOR,
  textureWidth: canvas3d.width,
  textureHeight: canvas3d.height,
  shader: WaterRippleReflectorShader,
});
reflector.rotation.x = -Math.PI / 2;
reflector.position.y = 0.01;
const rippleUniforms = reflector.material.uniforms;
const waterMaterial = new THREE.MeshStandardMaterial({
  color: WATER_COLOR,
  metalness: 0.05,
  roughness: 0.15,
  transparent: true,
  opacity: 0.55,
  side: THREE.DoubleSide,
  depthWrite: false,
});
const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.rotation.x = -Math.PI / 2;
water.position.y = 0.02;
water.renderOrder = 1;
water.layers.set(1);
scenePivot.add(reflector);
scenePivot.add(water);

const dir = new THREE.DirectionalLight(0xffffff, 1.0 * DIRECTIONAL_LIGHT_COEF); // d2js版と見た目が同じになるように係数をかける
dir.position.set(lightX, lightY, lightZ);
dir.target.position.set(0.0, lookY, 0.0);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.near = 0.5;
dir.shadow.camera.far = 40.0;
const shadowExtent = 12.0 * (GROUND_PLANE_SIZE / 20.0);
dir.shadow.camera.left = -shadowExtent;
dir.shadow.camera.right = shadowExtent;
dir.shadow.camera.top = shadowExtent;
dir.shadow.camera.bottom = -shadowExtent;
scene.add(dir);
scene.add(dir.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.5 * AMBIENT_LIGHT_COEF)); // d2js版と見た目が同じになるように係数をかける

async function init() {
  const specs = [
    { name: "witch", scale: 0.015, pos: [0.0, 0.05, 0.0], diffuse: 0.8 },
    { name: "cat", scale: 0.005, pos: [-1.5, 0.4, 0.5] },
    { name: "swan", scale: 0.005, pos: [2.0, 2.0, 0.5], kaBlend: 0.35 },
    { name: "mesh", scale: 0.033, pos: [0.0, 1.2, -1.5] },
  ];
  try {
    for (const s of specs) {
      const root = await loadObjMtl(MODEL_DIR, s.name);
      if (s.name === "witch") {
        applyDiffuseDataUrlTextures(root, [
          { materialName: "kao", dataUrl: img_src[0] },
          { materialName: "body", dataUrl: img_src[1] },
          { materialName: "fire", dataUrl: img_src[2] },
        ]);
      }
      if (s.name === "mesh") {
        applyDiffuseDataUrlTextures(root, [
          { materialName: "mat1", dataUrl: img_src_mesh },
        ]);
      }
      convertMaterialsToLambert(root);
      if (s.diffuse !== undefined) applyDiffuse(root, s.diffuse, s.diffuse, s.diffuse);
      if (s.kaBlend !== undefined) applyKaBlendToDiffuse(root, s.kaBlend);
      applySmoothShading(root);
      root.scale.setScalar(s.scale);
      root.position.set(s.pos[0], s.pos[1], s.pos[2]);
      const castShadow = !s.ground;
      root.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = castShadow;
          obj.receiveShadow = true;
        }
      });
      scenePivot.add(root);
    }
    image_loaded = true;
  } catch (e) {
    console.error(e);
  }
}
init();

let mirrorElapse = 0;

setAnimationLoop(renderer, () => (image_loaded ? 1000 / 30/*フレーム*/ : 100), () => {
  if (keys.has("ArrowUp")) lightY += LIGHT_STEP;
  if (keys.has("ArrowDown")) lightY -= LIGHT_STEP;
  if (keys.has("ArrowLeft")) lightX -= LIGHT_STEP;
  if (keys.has("ArrowRight")) lightX += LIGHT_STEP;
  if (keys.has("KeyZ")) lightZ += LIGHT_STEP;
  if (keys.has("KeyX")) lightZ -= LIGHT_STEP;

  mirrorElapse += 1.0;
  rippleUniforms.uElapse.value = mirrorElapse;
  rippleUniforms.uWaveType.value = waveType;

  scenePivot.rotation.set(
    THREE.MathUtils.degToRad(rotateX),
    THREE.MathUtils.degToRad(rotateY),
    0.0,
    "XYZ"
  );

  const pivotRot = new THREE.Matrix4().makeRotationFromEuler(scenePivot.rotation);
  const transLight = new THREE.Vector3(lightX, lightY, lightZ)
    .sub(worldPivot)
    .applyMatrix4(pivotRot)
    .add(worldPivot);
  dir.position.copy(transLight);
  dir.target.position.set(0.0, lookY, 0.0);
  dir.target.updateMatrixWorld();

  camera.lookAt(0.0, lookY, 0.0);
  renderer.render(scene, camera);

  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.font = "24px 'MS Gothic', sans-serif";
  context.fillStyle = "rgb(255, 0, 255)";
  context.fillText("waveType " + waveType, 0, 24);
  context.fillText("rotateX " + rotateX.toFixed(1), 0, 48);
  context.fillText("rotateY " + rotateY.toFixed(1), 0, 72);
  context.fillText("lightX " + lightX.toFixed(1), 0, 96);
  context.fillText("lightY " + lightY.toFixed(1), 0, 120);
  context.fillText("lightZ " + lightZ.toFixed(1), 0, 144);
});

let mouseDown = false;
let mouseX = 0;
let mouseY = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
  mouseDown = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
window.addEventListener("pointerup", () => {
  mouseDown = false;
});
window.addEventListener("pointermove", (e) => {
  if (!mouseDown) return;
  rotateX += (e.clientY - mouseY) / 2.0;
  rotateY += (e.clientX - mouseX) / 2.0;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Digit1" || e.code === "Numpad1") waveType = 0;
  else if (e.code === "Digit2" || e.code === "Numpad2") waveType = 1;
  else if (e.code === "Digit3" || e.code === "Numpad3") waveType = 2;
});
</script>
</head>
<body>
<div align="center">
  <div style="position:relative">
    <canvas id="hoge_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0); pointer-events:none" width="640" height="480"></canvas>
  </div>
</div>
</body>
</html>
