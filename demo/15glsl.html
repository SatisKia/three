<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title></title>
<script src="texture_witch.js"></script>
<script src="texture_mesh.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/loaders/OBJLoader.js": "./node_modules/three/examples/jsm/loaders/OBJLoader.js",
    "three/addons/loaders/MTLLoader.js": "./node_modules/three/examples/jsm/loaders/MTLLoader.js",
    "three/addons/objects/Reflector.js": "./node_modules/three/examples/jsm/objects/Reflector.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { Reflector } from "three/addons/objects/Reflector.js";
import { applyDiffuse, applyDiffuseMapsFromDataUrls, applyKaBlendToDiffuse, applySmoothShading, convertMaterialsToLambert, loadObjMtl } from "./loadObjMtl.js";
import { setAnimationLoop } from "./common.js";

const MODEL_DIR = "./model/";

const AMBIENT_LIGHT_COEF = 1.0; // d2js版と見た目が同じになるように係数をかける
const DIRECTIONAL_LIGHT_COEF = 5.0; // d2js版と見た目が同じになるように係数をかける

const GROUND_MODEL_SCALE = 0.033;
const GROUND_PLANE_SIZE = 200 * GROUND_MODEL_SCALE;
const REFLECTOR_COLOR = 0xffffff;
const WATER_COLOR = 0x808080;
const WATER_METALNESS = 0.05;
const WATER_ROUGHNESS = 0.15;

let dispMesh = false;
let meshObjRoot = null;
// 0=単純なsin×cos 1=重ね波（ノイズなし） 2=重ね波（ノイズあり）
let waveType = 0;

// 反射(mirrorShader)と影(地面のsceneShader)で異なった振幅を設定できるように
const REFLECT_RIPPLE_AMPLITUDE_X = 0.001 * 20;
const REFLECT_RIPPLE_AMPLITUDE_Y = 0.001;
const SHADOW_RIPPLE_AMPLITUDE_X = 0.001 * 20;
const SHADOW_RIPPLE_AMPLITUDE_Y = 0.001;

const waterRippleUniforms = {
  uWaveType: { value: 0 },
  uFrequencyX: { value: 0.1 },
  uFrequencyY: { value: 0.1 },
  uAmplitudeX: { value: REFLECT_RIPPLE_AMPLITUDE_X },
  uAmplitudeY: { value: REFLECT_RIPPLE_AMPLITUDE_Y },
  uShadowAmplitudeX: { value: SHADOW_RIPPLE_AMPLITUDE_X },
  uShadowAmplitudeY: { value: SHADOW_RIPPLE_AMPLITUDE_Y },
  uSpeedX: { value: 0.5 },
  uSpeedY: { value: 0.5 },
  uElapse: { value: 0.0 },
  uNoiseScale: { value: 0.02 },
  uNoiseTimeScale: { value: 0.1 },
  uNoiseStrength: { value: 0.2 },
  uNoiseAmplitude: { value: 0.5 },
};

const WATER_RIPPLE_GLSL = /*glsl*/`
  uniform int uWaveType; // 0=単純sin/cos 1=重ねsinのみ 2=重ねsin＋ノイズ（フラグメント内分岐）
  uniform float uFrequencyX, uFrequencyY; // 波の画面空間における頻度（X/Y別）
  uniform float uSpeedX, uSpeedY; // 時間uElapseに対する進行スピード
  uniform float uElapse; // 経過タイム（フレームカウント等を蓄積した値）
  uniform float uNoiseScale; // ノイズ座標の空間スケール
  uniform float uNoiseTimeScale; // ノイズに時間を載せる量
  uniform float uNoiseStrength; // ノイズを位相へ効かせる強さの係数
  uniform float uNoiseAmplitude; // 振幅へノイズを掛ける際の係数

  float rippleRandom(vec2 st) { // [0,1)のハッシュ値：擬似乱数1サンプル
    return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123); // 正弦＋フラクタルの定番式
  }

  float rippleSmoothNoise(vec2 st) { // セル単位バイリニア風な滑らかノイズ
    vec2 i = floor(st); // 格子の左下インデックス
    vec2 f = fract(st); // 格子内の小数オフセット[0,1)^2
    float a = rippleRandom(i); // 左下コーナーの乱数
    float b = rippleRandom(i + vec2(1.0, 0.0)); // 右下
    float c = rippleRandom(i + vec2(0.0, 1.0)); // 左上
    float d = rippleRandom(i + vec2(1.0, 1.0)); // 右上
    vec2 u = f * f * (3.0 - 2.0 * f); // smoothstep相当で端を滑らかに
    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y; // 双線形ブレンド
  }

  float rippleNoise(vec2 st, float scale) { // FB M風オクターブ：粗さscaleで4段重ね
    float value = 0.0; // 蓄積ノイズ
    float amplitude = 1.0; // 現在オクターブの重み
    float frequency = 1.0; // 現在オクターブの周波数倍率
    for (int i = 0; i < 4; i++) { // オクターブ4回ループ（WebGLで定数のみ）
      value += amplitude * rippleSmoothNoise(st * frequency * scale); // 細かさを増しながら加算
      amplitude *= 0.5; // 高周波ほど振幅を弱める
      frequency *= 2.0; // 次オクターブは2倍細かく
    }
    return value; // [0付近～]のノイズ和
  }

  float rippleWave(float x, float y, float freq, float amp, float speed, float time, float dx, float dy) {
    // 画面ピクセル座標由来の(x,y)、方向(dx,dy)で進行する波オフセット1成分
    if (uWaveType == 1) { // Type1：純sin、ノイズなし（重ね合わせは呼び出し側）
      float wave = sin(x * dx * freq + y * dy * freq + time * speed); // 位相項
      return wave * amp; // 振幅調整済み値
    } else { // Type2など：ノイズで位相と振幅を変調（Type1は上記ifでreturn済み）
      vec2 noiseCoord = vec2(x * dx * uNoiseScale, y * dy * uNoiseScale + time * uNoiseTimeScale); // ノイズ用UV
      float noiseValue = rippleNoise(noiseCoord, 1.0) * uNoiseStrength; // スケール1のnoiseを強さで調整
      float wave = sin(x * dx * freq + y * dy * freq + time * speed + noiseValue * 3.14159); // PIで位相ゆらぐsin
      return wave * amp * (1.0 + noiseValue * uNoiseAmplitude); // 振幅もノイズで変調
    }
  }

  vec2 waterRippleOffset(vec2 amplitude) {
    float offsetX = 0.0; // テクスチャ空間での横方向ゆらぎ（加算単位）
    if (uFrequencyX != 0.0) { // X頻度0なら計算省略
      if (uWaveType == 0) { // Type0：画面Xに沿った単一sinオフセット
        offsetX = sin(gl_FragCoord.x * uFrequencyX + uElapse * uSpeedX) * amplitude.x; // ピクセル座標依存
      } else { // Type1/2：3本の波を重ね（周波数・振幅・進行係数ずらし）
        offsetX += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyX, amplitude.x, uSpeedX, uElapse, 1.0, 0.0); // メイン進行+X
        offsetX += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyX * 0.7, amplitude.x * 0.5, uSpeedX * 0.8, uElapse, 0.7, 0.7); // 斜め系
        offsetX += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyX * 1.5, amplitude.x * 0.3, uSpeedX * 1.2, uElapse, 0.3, 0.9); // 細ripple
      }
    }
    float offsetY = 0.0; // 縦方向ゆらぎ
    if (uFrequencyY != 0.0) { // Y頻度0省略
      if (uWaveType == 0) { // cosでY依存（Xはsinと対）
        offsetY = cos(gl_FragCoord.y * uFrequencyY + uElapse * uSpeedY) * amplitude.y;
      } else { // Y方向にも3成分重ね
        offsetY += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyY, amplitude.y, uSpeedY, uElapse, 0.0, 1.0);
        offsetY += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyY * 0.7, amplitude.y * 0.5, uSpeedY * 0.8, uElapse, 0.7, 0.7);
        offsetY += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyY * 1.5, amplitude.y * 0.3, uSpeedY * 1.2, uElapse, 0.3, 0.9);
      }
    }
    return vec2(offsetX, offsetY);
  }
`;

const WATER_SHADOW_RIPPLE_UNIFORM_DECL = /*glsl*/`
  uniform float uShadowAmplitudeX, uShadowAmplitudeY;
`;

function applyWaterShadowRipple(material) {
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, waterRippleUniforms);
    const patchedShadowChunk =
      WATER_RIPPLE_GLSL + WATER_SHADOW_RIPPLE_UNIFORM_DECL +
      THREE.ShaderChunk.shadowmap_pars_fragment.replace(
        "shadowCoord.xyz /= shadowCoord.w;",
        "shadowCoord.xy += waterRippleOffset(vec2(uShadowAmplitudeX, uShadowAmplitudeY)) * shadowCoord.w; shadowCoord.xyz /= shadowCoord.w;"
      );
    shader.fragmentShader = shader.fragmentShader.replace(
      "#include <shadowmap_pars_fragment>",
      patchedShadowChunk
    );
  };
  material.customProgramCacheKey = () => "waterShadowRipple";
}

// Reflector既定フラグメントに、UVゆらぎを追加。gl_FragCoordベースでoffsetを積み、texture2DProj前に透視補正UVへ加える。
const WaterRippleReflectorShader = {
  name: "WaterRippleReflectorShader",
  uniforms: {
    color: { value: new THREE.Color(0x7f7f7f) },
    tDiffuse: { value: null },
    textureMatrix: { value: new THREE.Matrix4() },
    uWaveType: waterRippleUniforms.uWaveType,
    uFrequencyX: waterRippleUniforms.uFrequencyX,
    uFrequencyY: waterRippleUniforms.uFrequencyY,
    uAmplitudeX: waterRippleUniforms.uAmplitudeX,
    uAmplitudeY: waterRippleUniforms.uAmplitudeY,
    uSpeedX: waterRippleUniforms.uSpeedX,
    uSpeedY: waterRippleUniforms.uSpeedY,
    uElapse: waterRippleUniforms.uElapse,
    uNoiseScale: waterRippleUniforms.uNoiseScale,
    uNoiseTimeScale: waterRippleUniforms.uNoiseTimeScale,
    uNoiseStrength: waterRippleUniforms.uNoiseStrength,
    uNoiseAmplitude: waterRippleUniforms.uNoiseAmplitude,
  },
  vertexShader: /*glsl*/`
    uniform mat4 textureMatrix; // Reflectorが渡す、反射サンプル用の投影行列（4x4）

    varying vec4 vTextureCoord; // フラグメントへ渡す同次投射UV（.xy/.z/.wを使用）

    #include <common> // Three共通チャンク（数学・定義など）
    #include <logdepthbuf_pars_vertex> // 対数デプスバッファ用の頂点側宣言チャンク

    void main() { // 各頂点で1回：投射UVとクリップ座標を求める
      vTextureCoord = textureMatrix * vec4(position, 1.0); // モデルローカル座標から反射テクスチャ空間への同次座標
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); // クリップ空間での頂点位置
      #include <logdepthbuf_vertex> // 対数デプス用にgl_Positionを補正
    }
  `,
  fragmentShader: /*glsl*/`
    uniform vec3 color; // オーバーレイ合成用ティントRGB（blendOverlayのブレンド相手）
    uniform sampler2D tDiffuse; // Reflectorがセットするオフスクリーンの反射カラーバッファ
    uniform float uAmplitudeX, uAmplitudeY; // 反射UVゆらぎの振幅

    varying vec4 vTextureCoord; // 頂点から補間された投射用同次座標

    #include <logdepthbuf_pars_fragment> // 対数デプス用フラグメント側事前宣言チャンク

    ${WATER_RIPPLE_GLSL}

    float blendOverlay(float base, float blend) { // スカラー1チャンネル・オーバーレイブレンド
      return (base < 0.5 ? (2.0 * base * blend) : (1.0 - 2.0 * (1.0 - base) * (1.0 - blend))); // Photoshop風overlay
    }

    vec3 blendOverlay(vec3 base, vec3 blend) { // RGB各チャンネルにオーバーレイ
      return vec3(
        blendOverlay(base.r, blend.r), // 赤チャンネル
        blendOverlay(base.g, blend.g), // 緑チャンネル
        blendOverlay(base.b, blend.b) // 青チャンネル
      );
    }

    void main() { // 各フラグメント1回：波でUVゆらして反射をサンプル
      #include <logdepthbuf_fragment> // 対数デプス用フラグメント本処理チャンク

      vec2 ripple = waterRippleOffset(vec2(uAmplitudeX, uAmplitudeY));

      float w = vTextureCoord.w; // 透視除算用の同次w（標準投射では奥行き関連）
      vec2 uv = vTextureCoord.xy / w; // 正規化デバイス前の同次から射影済みUV相当の2次元
      uv += ripple; // ゆらぎをUVに反映
      vec4 distortedUv = vec4(uv * w, vTextureCoord.z, w); // Proj用にxyを再度wでスケール、zとwは元を踏襲

      vec4 base = texture2DProj(tDiffuse, distortedUv); // 歪んだ同次座標で反射テクスチャを投射サンプル
      gl_FragColor = vec4(blendOverlay(base.rgb, color), 1.0); // RGBはオーバーレイ、Aは不透明

      #include <tonemapping_fragment> // レンダラー設定に応じトーンマップ
      #include <colorspace_fragment> // sRGB出力など色空間変換
    }
  `,
};

let image_loaded = false;

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0000ff);

const lookY = 0.0;
const camera = new THREE.PerspectiveCamera(45.0, canvas3d.width / canvas3d.height, 0.1, 100.0);
camera.position.set(0.0, 0.0, 7.5);
camera.lookAt(0.0, lookY, 0.0);
camera.layers.enable(1);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
renderer.setSize(canvas3d.width, canvas3d.height);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scenePivot = new THREE.Group();
scenePivot.position.set(0.0, lookY, 0.0);
scene.add(scenePivot);

const worldPivot = new THREE.Vector3(0.0, lookY, 0.0);

let lightX = -3.0;
let lightY = 7.5;
let lightZ = 3.5;
const LIGHT_STEP = 0.1;

let rotateX = 25.0;
let rotateY = 25.0;

const keys = new Set();
window.addEventListener("keydown", (e) => keys.add(e.code));
window.addEventListener("keyup", (e) => keys.delete(e.code));

// 水平面はフラット（ゆらぎはReflectorのフラグメントで反射UVオフセット）
const waterGeometry = new THREE.PlaneGeometry(GROUND_PLANE_SIZE, GROUND_PLANE_SIZE, 1, 1);
const reflector = new Reflector(waterGeometry, {
  color: REFLECTOR_COLOR,
  textureWidth: canvas3d.width,
  textureHeight: canvas3d.height,
  shader: WaterRippleReflectorShader,
});
reflector.rotation.x = -Math.PI / 2;
reflector.position.y = 0.01;
// ReflectorはUniformsUtils.cloneするため、共有参照に差し替えないとuElapseが更新されない
for (const key of Object.keys(waterRippleUniforms)) {
  if (reflector.material.uniforms[key] !== undefined) reflector.material.uniforms[key] = waterRippleUniforms[key];
}
const waterMaterial = new THREE.MeshStandardMaterial({
  color: WATER_COLOR,
  metalness: WATER_METALNESS,
  roughness: WATER_ROUGHNESS,
  transparent: true,
  opacity: 0.55,
  side: THREE.DoubleSide,
  depthWrite: false,
});
const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.rotation.x = -Math.PI / 2;
water.position.y = 0.02;
water.renderOrder = 1;
water.layers.set(1);
water.receiveShadow = true;
applyWaterShadowRipple(waterMaterial);
scenePivot.add(reflector);
scenePivot.add(water);

const dir = new THREE.DirectionalLight(0xffffff, 1.0 * DIRECTIONAL_LIGHT_COEF); // d2js版と見た目が同じになるように係数をかける
dir.layers.enable(1); // 水面はレイヤ1。影の投射・受光の対象に含める
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.near = 0.5;
dir.shadow.camera.far = 40.0;
const shadowExtent = 12.0 * (GROUND_PLANE_SIZE / 20.0);
dir.shadow.camera.left = -shadowExtent;
dir.shadow.camera.right = shadowExtent;
dir.shadow.camera.top = shadowExtent;
dir.shadow.camera.bottom = -shadowExtent;
dir.position.set(lightX, lightY, lightZ);
dir.target.position.set(0.0, lookY, 0.0);
scene.add(dir);
scene.add(dir.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.5 * AMBIENT_LIGHT_COEF)); // d2js版と見た目が同じになるように係数をかける

(async () => {
  const specs = [
    { name: "witch", scale: 0.015, pos: [0.0, 0.05, 0.0], diffuse: 0.8 },
    { name: "cat", scale: 0.005, pos: [-1.5, 0.4, 0.5] },
    { name: "swan", scale: 0.005, pos: [2.0, 2.0, 0.5], kaBlend: 0.35 },
    { name: "mesh", scale: GROUND_MODEL_SCALE, pos: [0.0, 1.2, -1.5] },
  ];
  try {
    for (const s of specs) {
      const root = await loadObjMtl(MODEL_DIR, s.name);
      convertMaterialsToLambert(root);
      if (s.name === "witch") {
        applyDiffuseMapsFromDataUrls(root, [
          { materialName: "kao", dataUrl: img_src[0] },
          { materialName: "body", dataUrl: img_src[1] },
          { materialName: "fire", dataUrl: img_src[2] },
        ]);
      }
      if (s.name === "mesh") {
        applyDiffuseMapsFromDataUrls(root, [
          { materialName: "mat1", dataUrl: img_src_mesh },
        ]);
      }
      if (s.diffuse !== undefined) applyDiffuse(root, new THREE.Color(s.diffuse, s.diffuse, s.diffuse));
      if (s.kaBlend !== undefined) applyKaBlendToDiffuse(root, s.kaBlend);
      applySmoothShading(root);
      root.scale.setScalar(s.scale);
      root.position.set(s.pos[0], s.pos[1], s.pos[2]);
      const castShadow = !s.ground;
      root.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = castShadow;
          obj.receiveShadow = true;
        }
      });
      scenePivot.add(root);
      if (s.name === "mesh") meshObjRoot = root;
    }
    if (meshObjRoot) meshObjRoot.visible = dispMesh;
    image_loaded = true;
  } catch (e) {
    console.error(e);
  }
})();

let elapse = 0;

setAnimationLoop(renderer, () => (image_loaded ? 1000 / 30/*フレーム*/ : 100), () => {
  if (keys.has("ArrowUp")) lightY += LIGHT_STEP;
  if (keys.has("ArrowDown")) lightY -= LIGHT_STEP;
  if (keys.has("ArrowLeft")) lightX -= LIGHT_STEP;
  if (keys.has("ArrowRight")) lightX += LIGHT_STEP;
  if (keys.has("KeyZ")) lightZ += LIGHT_STEP;
  if (keys.has("KeyX")) lightZ -= LIGHT_STEP;

  elapse += 1.0;
  waterRippleUniforms.uElapse.value = elapse;
  waterRippleUniforms.uWaveType.value = waveType;

  scenePivot.rotation.set(
    THREE.MathUtils.degToRad(rotateX),
    THREE.MathUtils.degToRad(rotateY),
    0.0,
    "XYZ"
  );

  const pivotRot = new THREE.Matrix4().makeRotationFromEuler(scenePivot.rotation);
  const transLight = new THREE.Vector3(lightX, lightY, lightZ)
    .sub(worldPivot)
    .applyMatrix4(pivotRot)
    .add(worldPivot);
  dir.position.copy(transLight);
  dir.target.position.set(0.0, lookY, 0.0);
  dir.target.updateMatrixWorld();

  camera.lookAt(0.0, lookY, 0.0);
  renderer.render(scene, camera);

  // 2Dグラフィック画面の描画
  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.font = "24px 'MS Gothic', sans-serif";
  context.fillStyle = "rgb(255, 0, 255)";
  context.fillText("waveType " + waveType, 0, 24);
  context.fillText("rotateX " + rotateX.toFixed(1), 0, 48);
  context.fillText("rotateY " + rotateY.toFixed(1), 0, 72);
  context.fillText("lightX " + lightX.toFixed(1), 0, 96);
  context.fillText("lightY " + lightY.toFixed(1), 0, 120);
  context.fillText("lightZ " + lightZ.toFixed(1), 0, 144);
});

let mouseDown = false;
let mouseX = 0;
let mouseY = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
  mouseDown = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
window.addEventListener("pointerup", () => {
  mouseDown = false;
});
window.addEventListener("pointermove", (e) => {
  if (!mouseDown) return;
  rotateX += (e.clientY - mouseY) / 2.0;
  rotateY += (e.clientX - mouseX) / 2.0;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Digit1" || e.code === "Numpad1") waveType = 0;
  else if (e.code === "Digit2" || e.code === "Numpad2") waveType = 1;
  else if (e.code === "Digit3" || e.code === "Numpad3") waveType = 2;
});
</script>
</head>
<body>
<div align="center">
  <div style="position:relative">
    <canvas id="hoge_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0); pointer-events:none" width="640" height="480"></canvas>
  </div>
</div>
</body>
</html>
