<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title></title>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/loaders/OBJLoader.js": "./node_modules/three/examples/jsm/loaders/OBJLoader.js",
    "three/addons/loaders/MTLLoader.js": "./node_modules/three/examples/jsm/loaders/MTLLoader.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { applySmoothShading, convertMaterialsToLambert, loadObjMtl } from "./loadObjMtl.js";
import { GROUND_SIZE, Jiki, WAIT_1 } from "./gameCommon.js";
import { mySetAnimationLoop } from "./common.js";

const MODEL_DIR = "./model/";

const FRAME_INTERVAL_MS = 1000 / WAIT_1;

const AMBIENT_LIGHT_COEF = 1.5; // d2js版と見た目が同じになるように係数をかける
const DIRECTIONAL_LIGHT_COEF = 12.0; // d2js版と見た目が同じになるように係数をかける

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 50.0, 500.0);

const camera = new THREE.PerspectiveCamera(45.0, canvas3d.width / canvas3d.height, 0.1, 1000.0);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, alpha: true });
renderer.setSize(canvas3d.width, canvas3d.height);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const amb = new THREE.AmbientLight(0xffffff, 0.6 * AMBIENT_LIGHT_COEF); // d2js版と見た目が同じになるように係数をかける
const light = new THREE.DirectionalLight(0xffffff, 0.5 * DIRECTIONAL_LIGHT_COEF); // d2js版と見た目が同じになるように係数をかける
light.position.set(-0.85, 0.8, -0.75);
scene.add(amb, light);

const keys = {};
window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

const jiki = new Jiki(1.0);
let jikiModel = null;
let groundTemplate = null;
const groundModels = [];

function setGroundTiles() {
  if (!groundTemplate) return; // loadObjMtlが非同期なため、完了前にアニメループが回る
  const gx = Math.floor(jiki.x() / GROUND_SIZE) * GROUND_SIZE;
  const gz = Math.floor(jiki.z() / GROUND_SIZE) * GROUND_SIZE;
  let i = 0;
  for (let zz = -1; zz <= 1; zz++) {
    for (let xx = -1; xx <= 1; xx++) {
      if (!groundModels[i]) {
        const m = groundTemplate.clone(true);
        scene.add(m);
        groundModels[i] = m;
      }
      const m = groundModels[i];
      m.position.set(gx + GROUND_SIZE * xx, 0.0, gz + GROUND_SIZE * zz);
      i++;
    }
  }
}

(async () => {
  try {
    groundTemplate = await loadObjMtl(MODEL_DIR, "ground");
    convertMaterialsToLambert(groundTemplate);
    applySmoothShading(groundTemplate);
    groundTemplate.scale.setScalar(6.0);

    jikiModel = await loadObjMtl(MODEL_DIR, "jiki");
    convertMaterialsToLambert(jikiModel);
    applySmoothShading(jikiModel);
    jikiModel.scale.setScalar(0.01);
    scene.add(jikiModel);

    setGroundTiles();
  } catch (e) {
    console.error(e);
  }
})();

mySetAnimationLoop(renderer, FRAME_INTERVAL_MS, () => {
  jiki.update(
    !!keys.ArrowUp,
    !!keys.ArrowDown,
    !!keys.ArrowLeft,
    !!keys.ArrowRight
  );
  setGroundTiles();
  if (jikiModel) jiki.pose(jikiModel);

  const camera_vx = -jiki.vx() * 10.0;
  const camera_vy = -jiki.vy() * 10.0;
  const camera_vz = -jiki.vz() * 10.0;
  const look_x = jiki.x();
  let look_y = jiki.y();
  const look_z = jiki.z();
  const camera_x = look_x + camera_vx;
  let camera_y = look_y + camera_vy;
  const camera_z = look_z + camera_vz;
  look_y += 1.0; // 自機の少し上
  camera_y += 2.0; // 少し上から見下ろす
  camera.position.set(camera_x, camera_y, camera_z);
  camera.lookAt(look_x, look_y, look_z);

  renderer.render(scene, camera);

  // 2Dグラフィック画面の描画
  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.strokeStyle = "rgb(0, 0, 0)";
  context.strokeRect(0, 0, canvas2d.width - 1, canvas2d.height - 1);
});
</script>
</head>
<body>
<div align="center">
  <div style="position:relative">
    <canvas id="hoge_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
  </div>
</div>
</body>
</html>
